name: CD

on:
    push:
        branches:
            - github-release

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Configure JDK 8
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '8'
            - name: Validate Gradle wrapper
              uses: gradle/wrapper-validation-action@e6e38bacfdf1a337459f332974bb2327a31aaf4b
            - name: Publish
              env:
                  SONATYPE_USERNAME_2: ${{ secrets.SONATYPE_USERNAME_2 }}
                  SONATYPE_PASSWORD_2: ${{ secrets.SONATYPE_PASSWORD_2 }}
                  LEGACY_SONATYPE_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
                  LEGACY_SONATYPE_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
                  GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
                  SIGNING_KEY_RING_FILE: ${{ secrets.SIGNING_KEY_RING_FILE }}
                  SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
                  SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
              run: |
                  export ORG_GRADLE_PROJECT_sonatypeUsername="${SONATYPE_USERNAME_2:-$LEGACY_SONATYPE_USERNAME}"
                  export ORG_GRADLE_PROJECT_sonatypePassword="${SONATYPE_PASSWORD_2:-$LEGACY_SONATYPE_PASSWORD}"
                  if [ -z "$ORG_GRADLE_PROJECT_sonatypeUsername" ] || [ -z "$ORG_GRADLE_PROJECT_sonatypePassword" ]; then
                    echo "::error::Missing Sonatype credentials (configure SONATYPE_USERNAME_2/SONATYPE_PASSWORD_2 or ORG_GRADLE_PROJECT_SONATYPEUSERNAME/ORG_GRADLE_PROJECT_SONATYPEPASSWORD)"
                    exit 1
                  fi
                  if [ -n "$GPG_PRIVATE_KEY" ]; then
                    ./gradlew clean build publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon --no-parallel -x test --stacktrace
                  elif [ -n "$SIGNING_KEY_RING_FILE" ]; then
                    mkdir -p ~/.gradle
                    printf '%s\n' "$SIGNING_KEY_RING_FILE" | base64 -di > ~/.gradle/secring.gpg
                    ./gradlew clean build publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon --no-parallel -x test --stacktrace -Psigning.keyId="$SIGNING_KEY_ID" -Psigning.password="$SIGNING_PASSWORD" -Psigning.secretKeyRingFile="$HOME/.gradle/secring.gpg"
                  else
                    echo "::error::Missing GPG signing credentials (configure GPG_PRIVATE_KEY/GPG_PRIVATE_PASSWORD or SIGNING_KEY_RING_FILE/SIGNING_KEY_ID/SIGNING_PASSWORD)"
                    exit 1
                  fi
